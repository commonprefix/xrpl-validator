# Install xrpld from the XRPLF RPM repository (packages.xrplf.org).
# Packaging moved off repos.ripple.com in Aug 2026. That repo is frozen at 3.3.0.
# Repo/key per https://xrpl.org/docs/infrastructure/installation/update-xrpld-manually-on-rhel

- name: Import XRPLF package signing key
  ansible.builtin.rpm_key:
    key: https://packages.xrplf.org/xrplf.asc
    fingerprint: B655 4167 4122 1F78 0FBC FBC9 AA84 D41A 11D2 9FA9
    state: present

- name: Add XRPLF repository
  ansible.builtin.yum_repository:
    name: xrplf
    description: XRPLF Packages
    baseurl: https://packages.xrplf.org/repository/rpm-stable/x86_64/
    gpgkey: https://packages.xrplf.org/xrplf.asc
    gpgcheck: true
    repo_gpgcheck: true
    enabled: true

- name: Remove retired Ripple repository
  ansible.builtin.yum_repository:
    name: ripple-stable
    state: absent

- name: Install xrpld
  ansible.builtin.dnf:
    name: xrpld
    state: present
    enablerepo: xrplf

- name: Ensure /var/lib/rippled is owned by xrpld
  ansible.builtin.file:
    path: /var/lib/rippled
    state: directory
    owner: xrpld
    group: xrpld
    mode: "0755"

- name: Ensure /var/lib/rippled/db is owned by xrpld
  ansible.builtin.file:
    path: /var/lib/rippled/db
    state: directory
    owner: xrpld
    group: xrpld
    mode: "0755"

# In-place migration sentinel: data preserved from the old rippled package is still
# owned by the rippled user (partly 0600) and crashes xrpld on startup. A recursive
# chown on every run would walk the whole ledger store, so only fix when the sentinel
# file has a foreign owner.
- name: Check ownership of preserved wallet.db (migration sentinel)
  ansible.builtin.stat:
    path: /var/lib/rippled/db/wallet.db
  register: rippled_wallet_db_stat

- name: Recursively fix ownership of preserved data (one-time after rippled migration)
  ansible.builtin.command: chown -R xrpld:xrpld /var/lib/rippled /var/log/rippled
  when: rippled_wallet_db_stat.stat.exists and rippled_wallet_db_stat.stat.pw_name != 'xrpld'
  changed_when: true

- name: Ensure swapfile is owned by root
  ansible.builtin.file:
    path: /var/lib/rippled/swapfile
    owner: root
    group: root

- name: Backup original xrpld.cfg
  ansible.builtin.copy:
    src: /etc/xrpld/xrpld.cfg
    dest: /etc/xrpld/xrpld.cfg.original
    remote_src: true
    force: false

- name: Ensure xrpld log directory exists
  ansible.builtin.file:
    path: /var/log/rippled
    state: directory
    owner: xrpld
    group: xrpld
    mode: "0755"

- name: Configure logrotate for xrpld
  ansible.builtin.copy:
    dest: /etc/logrotate.d/rippled
    mode: "0644"
    content: |
      /var/log/rippled/debug.log{% if rippled_xrplf_monitoring | default('false') == 'true' %} /var/log/rippled/perf.log{% endif %} {
          size {{ rippled_log_max_size_mb }}M
          rotate {{ rippled_log_max_files }}
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
