- name: Enable and start xrpld
  ansible.builtin.systemd:
    name: xrpld
    state: started
    enabled: true

# The xrpld package ships no update script (unlike old rippled) - deploy our own
- name: Deploy update-xrpld-aws helper script
  ansible.builtin.copy:
    src: update-xrpld-aws.sh
    dest: /usr/local/bin/update-xrpld-aws
    owner: root
    group: root
    mode: "0755"
